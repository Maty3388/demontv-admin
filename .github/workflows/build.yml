name: Build APK
on:
  push:
    branches: [ master, main ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
      - name: Setup project
        run: |
          flutter create --org com.demontv --project-name demontv_admin tmp_app
          cp -r tmp_app/android .
          rm -rf tmp_app
          sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|<manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/>|' android/app/src/main/AndroidManifest.xml
          sed -i 's/signingConfig = signingConfigs.debug/signingConfig = signingConfigs.release/' android/app/build.gradle
          sed -i 's/android:label="demontv_admin"/android:label="FluxTv Panel"/' android/app/src/main/AndroidManifest.xml
          sed -i '/buildTypes {/i\    signingConfigs { release { def p=new Properties(); p.load(new FileInputStream(rootProject.file("key.properties"))); storeFile file(p["storeFile"]); storePassword p["storePassword"]; keyAlias p["keyAlias"]; keyPassword p["keyPassword"] } }' android/app/build.gradle
      - name: Setup keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/demontv.keystore
          printf "storePassword=${{ secrets.KEYSTORE_PASSWORD }}\nkeyPassword=${{ secrets.KEY_PASSWORD }}\nkeyAlias=${{ secrets.KEY_ALIAS }}\nstoreFile=demontv.keystore\n" > android/key.properties
      - name: Fix Kotlin stdlib duplicates
        run: |
          printf 'allprojects {\n  configurations.all {\n    resolutionStrategy {\n      force "org.jetbrains.kotlin:kotlin-stdlib:1.8.10"\n      force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.10"\n      force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.10"\n    }\n  }\n}\n' >> android/build.gradle
      - name: Copy launcher icons
        run: |
          cp assets/icons/mdpi.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp assets/icons/hdpi.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp assets/icons/xhdpi.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp assets/icons/xxhdpi.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp assets/icons/xxxhdpi.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons
      - name: Get version
        id: ver
        run: echo "VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)" >> $GITHUB_OUTPUT
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.ver.outputs.VERSION }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

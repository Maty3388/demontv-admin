name: Build APK
on:
  push:
    branches: [ master, main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
      - name: Setup project
        run: |
          flutter create --org com.demontv --project-name demontv_admin tmp_app
          cp -r tmp_app/android .
          rm -rf tmp_app
          python3 -c "
          f = open('android/build.gradle','r'); c = f.read(); f.close()
          c = c.replace('<latest-version>','1.9.0')
          f = open('android/build.gradle','w'); f.write(c); f.close()
          print('Kotlin version fixed')
          "
      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: demontv-admin-apk
          path: build/app/outputs/flutter-apk/app-release.apk

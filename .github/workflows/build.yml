name: Build APK
on:
  push:
    branches: [ master, main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.6"
      - name: Setup project
        run: |
          flutter create --org com.demontv --project-name demontv_admin tmp_app
          cp -r tmp_app/android .
          rm -rf tmp_app
          sed -i "s|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <uses-permission android:name="android.permission.INTERNET"/>|" android/app/src/main/AndroidManifest.xml
          pip install pillow -q
          python3 -c "from PIL import Image; import os; sizes={chr(39)mipmap-mdpi chr(39):48, chr(39)mipmap-hdpi chr(39):72, chr(39)mipmap-xhdpi chr(39):96, chr(39)mipmap-xxhdpi chr(39):144, chr(39)mipmap-xxxhdpi chr(39):192}"
      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: demontv-admin-apk
          path: build/app/outputs/flutter-apk/app-release.apk
